<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Viewer Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <h1>TV Viewer Debug Console</h1>
    <div>
        <label>Channel ID: <input type="text" id="channelId" value="BS11_2"></label>
        <button onclick="testChannel()">Test Channel</button>
        <button onclick="startStream()">Start Stream</button>
        <button onclick="loadVideo()">Load Video</button>
    </div>
    
    <h2>Video Player</h2>
    <video id="video" controls style="width: 100%; max-width: 640px;"></video>
    
    <h2>Console Output</h2>
    <pre id="console" style="background: #f0f0f0; padding: 10px; height: 300px; overflow-y: auto;"></pre>
    
    <script>
        const consoleEl = document.getElementById('console');
        let hls = null;
        
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            consoleEl.innerHTML += `<span style="color: ${color}">[${time}] ${message}</span>\n`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
            console.log(message);
        }
        
        async function testChannel() {
            const channelId = document.getElementById('channelId').value;
            try {
                log(`Testing channel ${channelId}...`);
                
                // Test API access
                const healthRes = await fetch('/api/health');
                const health = await healthRes.json();
                log(`Health check: ${JSON.stringify(health)}`, 'success');
                
                // Test channel list
                const channelsRes = await fetch('/api/channels');
                const channels = await channelsRes.json();
                log(`Found ${channels.length} channels`, 'success');
                
                // Check if channel exists
                const channel = channels.find(ch => ch.channel === channelId);
                if (channel) {
                    log(`Channel ${channelId} found: ${channel.name}`, 'success');
                } else {
                    log(`Channel ${channelId} not found!`, 'error');
                }
                
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        async function startStream() {
            const channelId = document.getElementById('channelId').value;
            try {
                log(`Starting stream for channel ${channelId}...`);
                
                const encodedChannelId = encodeURIComponent(channelId);
                const response = await fetch(`/api/channels/${encodedChannelId}/stream`);
                log(`Response status: ${response.status}`);
                
                const data = await response.json();
                log(`Stream response: ${JSON.stringify(data)}`, 'success');
                
                // Wait and check playlist
                setTimeout(async () => {
                    const encodedChannelId = encodeURIComponent(channelId);
                    const playlistRes = await fetch(`/api/stream/${encodedChannelId}/playlist.m3u8`);
                    log(`Playlist status: ${playlistRes.status}`);
                    if (playlistRes.ok) {
                        const playlist = await playlistRes.text();
                        log(`Playlist content (first 200 chars): ${playlist.substring(0, 200)}`, 'success');
                    } else {
                        log(`Playlist not ready yet`, 'error');
                    }
                }, 3000);
                
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        function loadVideo() {
            const channelId = document.getElementById('channelId').value;
            const video = document.getElementById('video');
            const encodedChannelId = encodeURIComponent(channelId);
            const playlistUrl = `/api/stream/${encodedChannelId}/playlist.m3u8`;
            
            try {
                log(`Loading video for channel ${channelId}...`);
                
                if (hls) {
                    hls.destroy();
                }
                
                if (Hls.isSupported()) {
                    hls = new Hls({
                        debug: true,
                        enableWorker: false,
                        lowLatencyMode: true
                    });
                    
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        log(`HLS Error: ${event} - ${JSON.stringify(data)}`, 'error');
                        
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    log('Fatal network error, trying to recover...', 'error');
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    log('Fatal media error, trying to recover...', 'error');
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    log('Fatal error, cannot recover', 'error');
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                    
                    hls.on(Hls.Events.MANIFEST_LOADED, function(event, data) {
                        log(`Manifest loaded: ${data.levels.length} quality levels`, 'success');
                    });
                    
                    hls.on(Hls.Events.LEVEL_LOADED, function(event, data) {
                        log(`Level loaded: ${data.details.fragments.length} fragments`, 'success');
                    });
                    
                    hls.loadSource(playlistUrl);
                    hls.attachMedia(video);
                    log(`HLS.js initialized and loading ${playlistUrl}`, 'success');
                    
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = playlistUrl;
                    log(`Using native HLS support`, 'success');
                } else {
                    log(`HLS not supported in this browser!`, 'error');
                }
                
            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }
        
        // Test on load
        window.addEventListener('load', () => {
            log('Debug page loaded');
            log(`User Agent: ${navigator.userAgent}`);
            log(`HLS.js supported: ${Hls.isSupported()}`);
        });
    </script>
</body>
</html>
