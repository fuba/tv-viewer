services:
  # Development configuration - mounts source code for hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "18088:18088"
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=18088
      - MIRAKURUN_URL=http://tuner:40772
      - PROGRAM_API_URL=http://puma2:40870
      - FUBA_RECORDER_API_URL=http://host.docker.internal:37569
      - GIN_MODE=debug
      - MAX_VIEWERS=4
      - MAX_CHANNEL_SESSIONS=1
      - MAX_HTTP_CONCURRENCY=32
      - EPG_CACHE_TTL_SECONDS=30
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./stream:/app/stream
    command: go run -tags native cmd/server/main.go
    networks:
      - tv-viewer-net

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    networks:
      - tv-viewer-net

networks:
  tv-viewer-net:
    driver: bridge

volumes:
  data:
  stream:
