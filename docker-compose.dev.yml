services:
  # Development configuration - mounts source code for hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "18088:18088"
    environment:
      - PORT=18088
      - MIRAKURUN_URL=http://tuner:40772
      - GIN_MODE=debug
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./stream:/app/stream
    command: go run cmd/server/main.go
    networks:
      - tv-viewer-net

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - tv-viewer-net

networks:
  tv-viewer-net:
    driver: bridge

volumes:
  data:
  stream: