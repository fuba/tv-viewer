# Simple GPU configuration - Mount nvidia-smi for detection
# Use with: docker compose -f docker-compose.yml -f docker-compose.gpu-simple.yml up

services:
  backend:
    # Mount nvidia-smi binary for GPU detection
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      # Mount NVIDIA device files
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    # Use privileged mode for GPU access (development only)
    privileged: true