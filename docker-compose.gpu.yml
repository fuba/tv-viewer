# Docker Compose configuration with NVIDIA GPU support
# Use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

services:
  backend:
    # Enable GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Additional environment variables for GPU support
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video