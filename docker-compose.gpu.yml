# Docker Compose configuration with NVIDIA GPU support
# Use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    # Enable GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Additional environment variables for GPU support
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      # Encoding quality: high, medium, low (default: high)
      - ENCODING_QUALITY=high
      # Use HEVC/H.265 encoding (default: false, uses H.264)
      - USE_HEVC=true