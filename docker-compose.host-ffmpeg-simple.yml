# Simple host FFmpeg configuration - Just mount the static binary
# Usage: docker compose -f docker-compose.yml -f docker-compose.host-ffmpeg-simple.yml up -d

services:
  backend:
    volumes:
      # The FFmpeg from johnvansickle is already static, but let's test with host one
      # First, let's check if host ffmpeg works in container
      - ./stream:/app/stream
    environment:
      # Tell encoder to use host mode
      - USE_HOST_FFMPEG=true
      - HOST_STREAM_PATH=/home/ec/tv-viewer/stream
      - HOST_FFMPEG_PATH=/usr/bin/ffmpeg