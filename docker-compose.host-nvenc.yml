# Complete host NVENC configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.host-nvenc.yml up -d

services:
  backend:
    volumes:
      # Mount host binaries
      - /usr/bin/ffmpeg:/usr/bin/ffmpeg:ro
      - /usr/bin/ffprobe:/usr/bin/ffprobe:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      # Mount all required libraries
      - /lib/x86_64-linux-gnu:/host/lib:ro
      - /usr/lib/x86_64-linux-gnu:/host/usr/lib:ro
      # Mount NVIDIA devices
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      # Use host stream directory
      - ./stream:/app/stream
    environment:
      # Use host binaries
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - PATH=/usr/bin:/bin:/usr/sbin:/sbin
      - LD_LIBRARY_PATH=/host/lib:/host/usr/lib:$LD_LIBRARY_PATH
    privileged: true