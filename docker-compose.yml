services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    ports:
      - "18088:18088"
    environment:
      - PORT=18088
      - MIRAKURUN_URL=http://tuner:40772
      - ENCODING_QUALITY=medium
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - USE_DIRECT_FFMPEG=true
      - SKIP_TS_FILTER=true
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    network_mode: host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "18089:18089"
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "18090:18090"
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host

networks:
  tv-viewer-net:
    driver: bridge

volumes:
  data: