services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    runtime: nvidia
    ports:
      - "18088:18088"
    environment:
      - PORT=18088
      - BIND_ADDRESS=127.0.0.1
      - ALLOWED_ORIGINS=https://tv.home.fuba.dev,http://puma2:18090,http://puma2:18089,http://localhost:18090,http://localhost:18089,http://127.0.0.1:18090,http://127.0.0.1:18089
      - GIN_MODE=release
      - MIRAKURUN_URL=http://tuner:40772
      - PROGRAM_API_URL=http://puma2:40870
      - FUBA_RECORDER_API_URL=http://127.0.0.1:37569
      - ENCODING_QUALITY=medium
      - MAX_VIEWERS=4
      - MAX_CHANNEL_SESSIONS=1
      - MAX_HTTP_CONCURRENCY=32
      - EPG_CACHE_TTL_SECONDS=30
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "18089:18089"
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "18090:18090"
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  tv-viewer-net:
    driver: bridge

volumes:
  data:
