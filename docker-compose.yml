services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18088:18088"
    environment:
      - PORT=18088
      - MIRAKURUN_URL=http://localhost:40772
    volumes:
      - ./data:/app/data
      - stream_data:/app/stream
    restart: unless-stopped
    network_mode: host

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host

networks:
  tv-viewer-net:
    driver: bridge

volumes:
  data:
  stream_data: