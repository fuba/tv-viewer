services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MIRAKURUN_URL=http://tuner:40772
    volumes:
      - ./data:/app/data
    depends_on:
      - ffmpeg
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  ffmpeg:
    build:
      context: ./docker/ffmpeg
      dockerfile: Dockerfile
    volumes:
      - ./stream:/app/stream
    restart: unless-stopped

volumes:
  data:
  stream: