worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 2;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Upstream backend
    upstream tv_backend {
        server host.docker.internal:18088;
        keepalive 32;
    }

    server {
        listen 8090;
        server_name _;

        # Large buffer sizes for streaming
        client_max_body_size 0;
        client_body_buffer_size 512k;
        
        # Proxy buffer settings optimized for HLS streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_store off;
        
        # Timeouts for long-lived connections
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API endpoints
        location /api/ {
            proxy_pass http://tv_backend;
            
            # CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        }

        # HLS playlist files - no caching
        location ~ \.m3u8$ {
            proxy_pass http://tv_backend;
            
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Expires 0;
            add_header Access-Control-Allow-Origin * always;
            
            # Disable proxy buffering for real-time updates
            proxy_buffering off;
        }

        # HLS segment files - optimized delivery
        location ~ \.ts$ {
            proxy_pass http://tv_backend;
            
            # Allow caching of segments
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin * always;
            
            # Enable sendfile for efficient file delivery
            sendfile on;
            tcp_nopush on;
            
            # Larger buffer for video segments
            proxy_buffer_size 1m;
            proxy_buffers 8 1m;
            proxy_busy_buffers_size 2m;
            proxy_max_temp_file_size 0;
            
            # Enable partial content for seeking
            proxy_force_ranges on;
        }

        # Static files
        location / {
            proxy_pass http://tv_backend;
        }
    }
}